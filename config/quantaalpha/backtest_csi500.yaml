random_seed: 42

experiment:
  name: "aster_csi500_quantaalpha"
  recorder: "aster_csi500_recorder"
  output_dir: "data/quantalpha/results/backtest"
  output_metrics_file: "backtest_metrics.json"

factor_source:
  type: "alpha158_20"
  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: false
  combined:
    official_source: "alpha158_20"
    include_custom: true

data:
  provider_uri: "data/quantalpha/qlib/cn_data"
  region: "cn"
  market: "csi500"
  start_time: "2016-11-24"
  end_time: "2026-11-24"

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"
  learn_processors:
    - class: "Fillna"
      kwargs: {fields_group: "feature"}
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs: {fields_group: "feature"}
    - class: "CSRankNorm"
      kwargs: {fields_group: "label"}
  infer_processors:
    - class: "Fillna"
      kwargs: {fields_group: "feature"}
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs: {fields_group: "feature"}
    - class: "CSRankNorm"
      kwargs: {fields_group: "label"}
  segments:
    train: ["2016-11-24", "2021-12-31"]
    valid: ["2022-01-01", "2022-12-31"]
    test: ["2023-01-01", "2026-11-24"]

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.05
    max_depth: 8
    num_leaves: 128
    colsample_bytree: 0.85
    subsample: 0.85
    lambda_l1: 100
    lambda_l2: 300
    num_threads: 4
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5
  backtest:
    start_time: "2023-01-01"
    end_time: "2026-11-24"
    account: 100000000
    benchmark: "SH000905"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

llm:
  enabled: false
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/quantalpha/results/factor_cache"
  auto_extract_cache: false
  debug: false

factor_calculation:
  output_dir: "data/quantalpha/results/computed_factors"
  save_intermediate: true
  n_jobs: 2
  data_file: null
